name: Generate PrismArc Manifest

on:
  push:
    branches:
      - main
    paths:
      - "files/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import quote

          OWNER = "lmJesterAndDev"
          REPOSITORY = "PrismArc-Distribution"
          BRANCH = "main"

          FILES_DIRECTORY = Path("files")
          MANIFEST_FILE = Path("manifest.json")

          files = []

          if FILES_DIRECTORY.exists():
              for file in sorted(FILES_DIRECTORY.rglob("*")):
                  if not file.is_file():
                      continue

                  relative = file.relative_to(FILES_DIRECTORY).as_posix()

                  sha256 = hashlib.sha256(file.read_bytes()).hexdigest()

                  encoded_path = "/".join(
                      quote(part)
                      for part in file.parts
                  )

                  url = (
                      f"https://raw.githubusercontent.com/"
                      f"{OWNER}/{REPOSITORY}/{BRANCH}/{encoded_path}"
                  )

                  files.append({
                      "path": relative,
                      "url": url,
                      "sha256": sha256
                  })

          manifest = {
              "version": "1.0.0",
              "minecraft": "1.21.1",
              "neoforge": "21.1.250",
              "files": files
          }

          MANIFEST_FILE.write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  ensure_ascii=False
              ) + "\n",
              encoding="utf-8"
          )

      - name: Commit manifest
        run: |
          git config user.name "PrismArc Bot"
          git config user.email "actions@github.com"

          git add manifest.json

          if git diff --cached --quiet; then
            echo "Manifest has not changed."
            exit 0
          fi

          git commit -m "Auto-update PrismArc manifest"
          git push
